<!doctype html>
<html>
  <head>
    <title>Foodies</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header>
      <h1>Foodies</h1>
      <nav>
        <a href="#">Home</a>
        <a href="#">Menu</a>
        <a href="#">Contact</a>
      </nav>
    </header>

    <section class="home">
      <h2>Delicious Food</h2>
      <p>Fresh and tasty food for you</p>
      <button>Order Now</button>
    </section>

    <section class="menu">
      <h2>Our Menu</h2>

      <div class="cards">
        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1574071318508-1cdbab80d002"
          />
          <h3>Pizza</h3>
          <p>₹199</p>
          <button>Order</button>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd"
          />
          <h3>Burger</h3>
          <p>₹149</p>
          <button>Order</button>
        </div>

        <div class="card">
          <img
            src="https://images.unsplash.com/photo-1559314809-0d155014e29e"
          />
          <h3>Pasta</h3>
          <p>₹179</p>
          <button>Order</button>
        </div>
      </div>
    </section>
  </body>
</html>
